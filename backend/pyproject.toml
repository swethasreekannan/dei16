[project]
name = "mde-backend"
version = "0.1.0"
description = "Marketing Delivery Engine - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "supabase>=2.11.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.42.0",
    "pymupdf>=1.25.0",
    "weasyprint>=63.0",
    "jinja2>=3.1.0",
    "pillow>=11.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"
